[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medexpert"
version = "0.1.0"
description = "Sistema experto basado en reglas para la orientación preventiva sobre automedicación en Perú (prototipo académico)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "python-multipart>=0.0.20",
    "clipspy==1.0.6",
    "sqlmodel==0.0.48",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.10.0",
    "playwright==1.64.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api = ["plantillas/*.html", "estaticos/*", "static/img/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".specify", ".claude", "specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/domain", "src/application"]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "integration: requiere la base de pruebas (TEST_DATABASE_URL) y PostgreSQL real",
    "aceptacion: biblioteca indexada de casos R01-R30 contra la base de pruebas (regresión)",
    "e2e: flujo completo en navegador con Playwright contra la base de pruebas",
    "lento: pruebas exhaustivas que tardan minutos (p. ej. las 16.128 combinaciones)",
]

[tool.coverage.run]
source = ["src/domain", "src/application"]
